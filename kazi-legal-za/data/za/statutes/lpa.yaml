statute: "Legal Practice Act 28 of 2014"
authority: "Department of Justice and Constitutional Development"
last_confirmed: "2026-05-20"
source_url: "https://www.saflii.org/za/legis/consol_act/lpa2014120.pdf"

sections:
  law_clinic_definition:
    ref: "LPA s34(8)"
    value: "A law clinic attached to a university faculty of law that renders legal services under supervision of attorneys, accessible to the public, free of charge except disbursements"
    effective_from: null
    effective_until: null
    effect: "Law clinics must be attached to a university, render services under attorney supervision, be publicly accessible, and provide services free of charge (may recover disbursements only)."

  law_clinic_supervision:
    ref: "LPA s34(8)(b)(i)"
    value: "Services rendered by or under the supervision of attorneys"
    effective_from: null
    effective_until: null
    effect: "All legal services rendered by a law clinic must be rendered by or under the direct supervision of admitted attorneys."

  community_service_practitioners:
    ref: "LPA s29, Regulation 4B"
    value: 40
    unit: "hours per calendar year"
    effective_from: "2024-01-01"
    effective_until: null
    effect: "Practising legal practitioners must complete 40 hours of community service or pro bono legal services per calendar year to maintain good standing with the LPC."
    gazette_date: "2023-08-11"

  community_service_candidates:
    ref: "LPA s29, Regulation 4A"
    value: 8
    unit: "hours per calendar year"
    effective_from: "2024-01-01"
    effective_until: null
    effect: "Candidate legal practitioners must complete 8 hours of community service per calendar year as a component of practical vocational training. Must be supervised by principal."
    gazette_date: "2023-08-11"

  admission_requirements:
    ref: "LPA s26(1)"
    value: "LLB degree or recognised equivalent, practical vocational training, competency-based examination"
    effective_from: null
    effective_until: null
    effect: "A person must hold an LLB (or recognised equivalent), complete practical vocational training as a candidate legal practitioner, and pass the LPC competency examination before admission."

  practical_vocational_training_attorney:
    ref: "LPA s26(1)(c), Regulation 6(1)"
    value: 24
    unit: "months (or 12 months with 400hr coursework)"
    effective_from: null
    effective_until: null
    effect: "Candidate attorneys must serve under a PVTC for 24 uninterrupted months (with 150hr coursework during or within 12 months after), or 12 months if 400hr coursework completed beforehand."

  # Trust-account provisions — added 2026-06-20, web-sourced (justice.gov.za LPA;
  # LSSA practice pamphlet; De Rebus) for the Kazi trust-reconciliation skill.
  # PENDING ATTORNEY CONFIRMATION before relied on in client-facing output.
  fidelity_fund_certificate:
    ref: "LPA s84(1)"
    value: "every legal practitioner who practises for own account and holds trust money must hold a Fidelity Fund certificate"
    effective_from: null
    effective_until: null
    effect: "A legal practitioner practising for own account (and any trust account practice) must be in possession of a current Fidelity Fund certificate to receive or hold trust money. A practitioner who practises without a Fidelity Fund certificate is not entitled to recover any fee for that work."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."

  trust_banking_account:
    ref: "LPA s86(1)"
    value: "must keep a separate trust banking account at a bank and deposit all trust money in it"
    effective_from: null
    effective_until: null
    effect: "Every trust account practice must keep a trust account at a bank with which the Legal Practitioners' Fidelity Fund has made an arrangement, and must deposit in it all money held or received on account of any person. Trust money must be kept separate from the practice's own business money."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."

  trust_interest_to_fund:
    ref: "LPA s86(2)"
    value: "interest on the trust banking account vests in and is paid to the Legal Practitioners' Fidelity Fund"
    effective_from: null
    effective_until: null
    effect: "Interest accrued on money in the section 86(1) trust banking account vests in the Legal Practitioners' Fidelity Fund; the bank pays the interest (less permitted bank charges) to the Fund."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."

  trust_investment_surplus:
    ref: "LPA s86(3)"
    value: "trust money not immediately required may be invested in a separate interest-bearing trust account, interest to the Fund"
    effective_from: null
    effective_until: null
    effect: "A trust account practice may invest in a separate trust savings or other interest-bearing account any trust money not immediately required. Interest on a section 86(3) account also vests in and is paid to the Fidelity Fund."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."

  trust_investment_client_instruction:
    ref: "LPA s86(4)"
    value: "on a client's instruction, open a separate interest-bearing trust account for that client, with interest accruing to the client"
    effective_from: null
    effective_until: null
    effect: "On the instruction of a person for whom money is held, a trust account practice may open a separate trust savings or interest-bearing account (a 'section 86(4) account') for that person; the interest accrues to that person (the client), not the Fund. This replaces section 78(2A) of the former Attorneys Act."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."

  trust_accounting_records:
    ref: "LPA s87"
    value: "must keep proper accounting records of trust money as prescribed by the Council's rules"
    effective_from: null
    effective_until: null
    effect: "A trust account practice must keep proper accounting records containing particulars of all money received, held, or paid by it for or on account of any person, in accordance with the Legal Practice Council's rules made under section 87."
    note: "Web-sourced 2026-06-20. Pending attorney confirmation."
