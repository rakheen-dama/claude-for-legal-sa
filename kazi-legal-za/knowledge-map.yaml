# Grounding contract for the kazi-legal-za skills.
#
# Each skill declares (a) the Kazi MCP tools/resources it calls and (b) the
# jurisdictions/za statute knowledge it cites. This is the single source the
# tooling reads:
#
#   scripts/sync-kazi-knowledge.py            bundles every cited statute file
#                                             from jurisdictions/za into
#                                             kazi-legal-za/data/za/ so it ships
#                                             with the plugin (repo-root dirs do
#                                             NOT ship inside a plugin).
#   scripts/validate-kazi-skill-grounding.py  enforces that every reference
#                                             resolves: each `mcp` entry exists
#                                             in data/mcp-catalogue.json, each
#                                             `za_knowledge` "file#section" exists
#                                             in both the source and the bundle,
#                                             the bundle matches source (no drift),
#                                             and cited statutes aren't stale.
#
# `status`:  built   skill exists under skills/<name>/ and is wired up.
#            planned  grounding is verified ahead of the skill being written.
#            blocked  cannot be grounded until a knowledge gap is filled.
#
# `knowledge_gaps`: honest notes about SA knowledge the skill needs that is NOT
# yet in jurisdictions/za. Surfaced by the linter as warnings so they are tracked,
# never silently ignored.

skills:
  connect-kazi:
    status: built
    mcp: [kazi_ping, firm-profile]
    za_knowledge: []

  fee-note-run:
    status: built
    mcp: [list_matters, get_unbilled_time, get_matter, firm-profile]
    za_knowledge:
      - contingency-fees.yaml#fee_cap_percentage
      - contingency-fees.yaml#formal_requirements
    knowledge_gaps:
      - "LSSA party-and-party / attorney-and-client tariff is not in jurisdictions/za. Until a tariff overlay is added, fee-note narratives rely on firm house style (from kazi://firm-profile) plus the Contingency Fees Act caps."

  trust-reconciliation:
    status: built
    mcp: [get_trust_balance, list_trust_transactions, list_matters]
    za_knowledge:
      - lpa.yaml#fidelity_fund_certificate
      - lpa.yaml#trust_banking_account
      - lpa.yaml#trust_investment_client_instruction
      - lpc-rules.yaml#trust_funds_sufficiency
      - lpc-rules.yaml#no_trust_debit
      - lpc-rules.yaml#monthly_trust_reconciliation
    caveats:
      - "Trust-accounting sections (LPA s84/s86/s87, LPC Rules 54.14.8/54.14.9/54.15.1/54.10) were web-sourced and authored 2026-06-20 to unblock this skill. They are flagged PENDING ATTORNEY CONFIRMATION in lpa.yaml / lpc-rules.yaml and must be sign-off-confirmed before E4 ships client-facing trust output. The skill must carry the [model knowledge — verify] source tag until then."

  fica-gap-review:
    status: built
    mcp: [list_compliance_gaps, get_client, get_matter]
    za_knowledge:
      - fica.yaml#customer_due_diligence
      - fica.yaml#beneficial_ownership
      - fica.yaml#rmcp_requirement
      - fica.yaml#cash_threshold_reporting

  matter-brief:
    status: built
    mcp: [get_matter, get_matter_activity, search_documents]
    za_knowledge: []

  kazi-bridge:
    status: built
    mcp: [get_matter, search_documents, get_document_url, get_matter_activity]
    za_knowledge: []

  intake-triage:
    status: built
    mcp: [list_clients, list_matters, firm-profile]
    za_knowledge:
      - magistrates-courts.yaml#district_court_monetary_jurisdiction
      - superior-courts.yaml#high_court_jurisdiction
      - prescription.yaml#general_debt_prescription
      - contingency-fees.yaml#fee_cap_percentage

  # Correspondence loop (Kazi Phase 81 write-back + Phase 82 read-back). These two
  # skills carry only light SA grounding (advisory prescription awareness for phrasing
  # proposed-task dates) — they are workflow skills, not statute-drafting skills.
  # propose_task's reach is deliberately limited to these two skills; do not retrofit
  # it into the five read-only/draft-only skills above.
  file-email:
    status: built
    mcp: [resolve_matter_by_email, file_correspondence, attach_document, propose_task]
    za_knowledge:
      - prescription.yaml#general_debt_prescription   # advisory, for proposed-task dates only

  correspondence-digest:
    status: built
    mcp: [list_correspondence, get_correspondence, propose_task, search_documents, get_document_url]
    za_knowledge:
      - prescription.yaml#general_debt_prescription   # advisory, for sanity-checking spotted dates
