name: "Discount pricing and bait marketing risk"
skill: marketing-claims-review
input: |
  Banner: "Was R999/month — now R299/month. Limited time. Save 70%."
expected_flags:
  - "'Was R999' — must have been genuinely offered at that price (CPA s30 bait marketing)"
  - "'Limited time' — needs actual end date"
  - "'Save 70%' — verify mathematical accuracy against genuine prior price"
expected_statutes:
  - "CPA s29-30"
  - "ARB Code"
  - "ECTA s43"
must_not_contain:
  - "FTC Guides Against Deceptive Pricing"
  - "state UDAP"
notes: |
  Tests bait marketing detection under CPA s30. The "was" price must
  have been a genuine prior selling price.
