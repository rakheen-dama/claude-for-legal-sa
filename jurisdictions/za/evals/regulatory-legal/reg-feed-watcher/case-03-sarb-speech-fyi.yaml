name: "Below-threshold filter — SARB Governor speech"
skill: reg-feed-watcher
input: |
  SARB Governor delivers speech on monetary policy outlook and
  financial stability. User materiality threshold classifies
  regulator speeches as "FYI."
expected_flags: []
expected_statutes: []
