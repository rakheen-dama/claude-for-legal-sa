name: "Misconduct dismissal without hearing"
skill: termination-review
input: |
  Employee dismissed for theft. No disciplinary hearing was held before
  dismissal.  The employee earns R180,000 per year (below the BCEA earnings
  threshold) and has 3 years of service.

expected_flags:
  - "No opportunity to respond"
  - "Earnings below BCEA threshold"

expected_statutes:
  - "LRA s188"
  - "Code of Good Practice: Dismissal"
  - "BCEA"

must_not_contain:
  - "FMLA"
  - "FLSA"
  - "at-will"

notes: |
  The dismissal is procedurally unfair because the employee was given no
  opportunity to respond before dismissal.  The 2025 Code of Good Practice:
  Dismissal (GenN 3470, GG 53294, effective 4 September 2025 — which
  replaced the Schedule 8 Code) requires a fair procedure before dismissal
  for misconduct — the employee must be notified of the allegations, given
  a genuine opportunity to state a case, and have the right to
  representation (a formal hearing is not mandatory, but the employee must
  be heard).
  Because the employee earns below the BCEA threshold, additional BCEA
  protections apply (e.g. notice periods, severance).  The substantive
  fairness of the dismissal (theft) is a separate question; even if the
  employer can prove theft, the lack of a hearing makes the dismissal
  unfair.
