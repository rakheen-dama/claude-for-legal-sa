statute: "Consumer Protection Act 68 of 2008"
authority: "Department of Trade, Industry and Competition"
last_confirmed: "2025-05-01"
source_url: "https://www.gov.za/documents/consumer-protection-act"

sections:
  juristic_person_threshold:
    ref: "CPA s5(2)(b), GN R294 GG 34399"
    value: 2000000
    currency: ZAR
    unit: "annual turnover or asset value"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "The CPA does not apply to transactions between juristic persons whose annual turnover or asset value equals or exceeds the threshold. Below-threshold juristic persons are treated as consumers."
    note: "Threshold set by Ministerial determination. Natural persons are always covered regardless of value."

  fixed_term_max_duration:
    ref: "CPA s14(1), Regulation 5(1)"
    value: 24
    unit: "months"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Fixed-term consumer agreements must not exceed 24 months from the date of signature, unless a longer period is expressly agreed and the supplier can demonstrate a financial benefit to the consumer."
    note: "s14 does NOT apply between juristic persons regardless of turnover — only natural persons and sole proprietors."

  cancellation_notice_period:
    ref: "CPA s14(2)(b)"
    value: 20
    unit: "business days"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "A consumer may cancel a fixed-term agreement at any time by giving the supplier 20 business days' written notice. The consumer remains liable for amounts owed up to the date of cancellation, and the supplier may impose a reasonable cancellation penalty."

  supplier_expiry_notice_min:
    ref: "CPA s14(2)(a)"
    value: 40
    unit: "business days before expiry"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "The supplier must give the consumer written notice of the pending expiry of a fixed-term agreement not less than 40 and not more than 80 business days before the expiry date."

  supplier_expiry_notice_max:
    ref: "CPA s14(2)(a)"
    value: 80
    unit: "business days before expiry"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Upper bound of the supplier notification window for pending expiry of fixed-term agreements."

  cooling_off_period:
    ref: "CPA s16(3)(a)"
    value: 5
    unit: "business days"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "A consumer who entered into a transaction as a result of direct marketing may cancel it within 5 business days after the later of the date on which the agreement was concluded or the goods were delivered."

  cpa_fine_max:
    ref: "CPA s112(1)"
    value: 1000000
    currency: ZAR
    unit: "per contravention or 10% of annual turnover"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "The National Consumer Tribunal may impose an administrative fine not exceeding the greater of R1,000,000 or 10% of the respondent's annual turnover."

  ncc_complaint_procedure:
    ref: "CPA s71"
    value: "consumer may file complaint with NCC"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Consumer may file complaint with National Consumer Commission alleging contravention of CPA; NCC must investigate and may issue compliance notice or refer to National Consumer Tribunal"

  product_safety_recall:
    ref: "CPA s60"
    value: "Minister or NCC may order product recall"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "If goods are unsafe, the NCC may require supplier to recall, repair, replace, or refund; supplier must notify consumers and implement recall within prescribed timeframes"

  industry_codes:
    ref: "CPA s82"
    value: "industry body may apply to NCC for approval of industry code"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Industry body may apply to NCC for approval of an industry code of conduct; approved codes supplement CPA and industry ombud schemes may be established to resolve complaints"

  plain_language:
    ref: "CPA s22"
    value: "notices, documents and visual representations must be in plain and understandable language"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "All consumer-facing notices, documents, and visual representations must be in plain and understandable language as defined in s22, enabling an ordinary consumer of the relevant class to understand the content without undue effort"

  misleading_marketing:
    ref: "CPA s29(b)"
    value: "marketing must not be misleading, fraudulent or deceptive in any way"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Suppliers are prohibited from marketing goods or services in a manner that is misleading, fraudulent, or deceptive in any way including by omission"

  bait_marketing:
    ref: "CPA s30"
    value: "advertising goods at a price the supplier does not intend to offer in reasonable quantities is prohibited"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "A supplier must not advertise goods or services at a specified price if the supplier does not intend to offer those goods or services at that price for a reasonable period and in reasonable quantities"

  promotional_competitions:
    ref: "CPA s36"
    value: "promotional competitions must comply with prescribed requirements"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Promotional competitions must have written rules, may not charge entry fees beyond standard communication costs, must disclose prizes and their values, and must be subject to independent verification of results"

  false_representations:
    ref: "CPA s41"
    value: "false, misleading or deceptive representations are prohibited"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "A supplier must not make false, misleading, or deceptive representations concerning any material fact to a consumer, whether by words, depiction, or conduct"

  unfair_contract_terms:
    ref: "CPA s48-52"
    value: "unfair, unreasonable or unjust contract terms are prohibited"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Section 48 prohibits unfair, unreasonable, or unjust contract terms; s49 requires adequate notice of unusual or onerous terms; s51 lists specifically prohibited terms including waiver of CPA rights and exclusion of s61 strict product liability"

  product_quality_safety:
    ref: "CPA s55-58"
    value: "consumers have the right to safe, good quality goods"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Section 55 grants the right to receive goods that are reasonably suitable and of good quality; s56 creates an implied warranty of quality for 6 months after delivery; s58 requires safety warnings and trade descriptions"

  strict_product_liability:
    ref: "CPA s61"
    value: "strict, no-fault liability for harm caused by defective goods"
    effective_from: "2011-04-01"
    effective_until: null
    effect: "Joint and several strict liability applies to the producer, importer, distributor, and retailer for any harm caused by defective goods, a failure in goods, a hazard in goods, or inadequate instructions or warnings; liability cannot be excluded by contract per s51(1)(c)"
    note: "Application to pure software and SaaS products is untested in South African courts"
