statute: "Electronic Communications and Transactions Act 25 of 2002"
authority: "Department of Communications and Digital Technologies"
last_confirmed: "2025-05-01"
source_url: "https://www.gov.za/documents/electronic-communications-and-transactions-act"

sections:
  data_message_legal_recognition:
    ref: "ECTA s11(1)"
    value: true
    effective_from: "2002-08-30"
    effective_until: null
    effect: "Information is not without legal force and effect merely because it is wholly or partly in the form of a data message."

  writing_requirement:
    ref: "ECTA s12"
    value: true
    effective_from: "2002-08-30"
    effective_until: null
    effect: "A requirement in law that a document or information must be in writing is met if the document is in the form of a data message and accessible for subsequent reference."

  electronic_signature_validity:
    ref: "ECTA s13(2)"
    value: true
    effective_from: "2002-08-30"
    effective_until: null
    effect: "An electronic signature is not without legal force and effect merely on the grounds that it is in electronic form."

  advanced_signature_required_when:
    ref: "ECTA s13(1)"
    value: "required by law without specifying type"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "Where the signature of a person is required by law and such law does not specify the type of signature, that requirement is met only if an advanced electronic signature is used."
    note: "Advanced e-signatures must be accredited by the SAAA. Required for: suretyships, copyright assignments, notarised documents, sealed documents."

  electronic_contract_formation:
    ref: "ECTA s22(1)"
    value: true
    effective_from: "2002-08-30"
    effective_until: null
    effect: "An agreement is not without legal force and effect merely because it was concluded partly or in whole by means of data messages."

  electronic_contract_conclusion:
    ref: "ECTA s22(2)"
    value: "at time and place acceptance received by offeror"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "An agreement concluded between parties by means of data messages is concluded at the time when and place where the acceptance of the offer was received by the offeror."

  schedule_1_exclusions:
    ref: "ECTA Schedule 1"
    value: "alienation of land, long leases >20 years, wills, bills of exchange"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "The provisions of ECTA relating to data messages, electronic signatures, and electronic transactions do not apply to these categories of agreements."

  takedown_notice:
    ref: "ECTA s77"
    value: true
    effective_from: "2002-08-30"
    effective_until: null
    effect: "A complainant may send a takedown notice to a service provider's designated agent requesting removal of infringing content. The notice must include: full contact details, description and location of the infringing material, statement of ownership or authority, and signature. Service providers that comply with takedown requests benefit from limitations on liability (safe harbour). There is no statutory counter-notice procedure — unlike the US DMCA, there is no mandatory 'put back' mechanism."
    note: "ECTA takedowns are not limited to copyright — they can apply to any unlawful content. The absence of a counter-notice regime means ISPs often over-comply (quick removal) to preserve safe harbour. Practice varies between ISPs."

  cryptography_provider_registration:
    ref: "ECTA s29-30"
    value: "cryptography service providers must register"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "Cryptography service providers must register with the Department of Communications before providing cryptography products or services in South Africa"
    note: "Registration requirements largely dormant but section remains in force"

  ecommerce_mandatory_disclosures:
    ref: "ECTA s43(1)"
    value: "online suppliers must display specified information on their website"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "Online suppliers must disclose on their website: full name and legal status, physical address, telephone number, email address, terms and conditions, pricing including delivery costs, payment and security mechanisms, and privacy policy"
    note: "Non-compliance is a criminal offence under s43(5)"

  ecommerce_review_and_correct:
    ref: "ECTA s43(2)"
    value: "consumer must be given opportunity to review and correct errors before placing order"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "An online supplier must provide the consumer with an opportunity to review the entire transaction and correct any errors before finally placing an order"

  ecommerce_cooling_off:
    ref: "ECTA s44"
    value: 7
    unit: "days"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "A natural person who has concluded an electronic transaction may cancel the transaction within 7 days of receiving the goods or services, without reason or penalty; the supplier must refund all payments within 30 days of cancellation"
    note: "More generous than CPA s16 cooling-off period of 5 business days"

  ecommerce_performance:
    ref: "ECTA s46"
    value: 30
    unit: "days"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "A supplier must execute an electronic transaction within 30 days of receiving the order, unless the parties have agreed otherwise; if unable to perform, the supplier must notify the consumer and refund all payments within 30 days"

  spam_unsolicited_communications:
    ref: "ECTA s45"
    value: "unsolicited electronic communications must include opt-out and source identification"
    effective_from: "2002-08-30"
    effective_until: null
    effect: "Unsolicited electronic communications must contain an opt-out mechanism enabling the recipient to cancel the subscription, and must identify the source and sender of the communication"
    note: "Overlaps with POPIA s69 regulation of direct marketing by electronic means"
