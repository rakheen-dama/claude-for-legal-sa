statute: "Prescribed Rate of Interest Act 55 of 1975"
authority: "Minister of Justice and Constitutional Development"
last_confirmed: "2026-07-03"
volatility: annual
source_url: "https://www.justice.gov.za/legislation/acts/1975-055.pdf"

sections:
  formula:
    ref: "Prescribed Rate of Interest Act s1(2)"
    value: "SARB repurchase (repo) rate + 3.5% per annum"
    effective_from: "2015-09-01"
    effective_until: null
    effect: "Since the 2015 amendment, the prescribed rate of interest is the SARB repo rate plus 3.5% per annum. The Minister publishes the amended rate by notice in the Gazette when the repo rate is adjusted, but the rate changes automatically under s1(2)(c) and takes effect from the first day of the second month following the month in which the repo rate is determined. Practitioners rely on the statutory formula, as Gazette notices are sometimes late, missing, or inconsistent with the granular repo-linked path."

