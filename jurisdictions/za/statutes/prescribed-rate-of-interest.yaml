    effective_until: "2025-04-30"
    effect: "Prescribed rate of interest (mora/judgment interest) of 11.25% per annum. Closed historical entry for temporal queries about interest running in this window."
    note: "Intermediate-step determination; exact GN/Gazette not confirmed (the rate changes automatically under s1(2)(c)). [Perplexity — verify]"

