  prescribed_rate_2026_03:
    ref: "Prescribed Rate of Interest Act s1(2); repo 6.75% + 3.5%; rate determination GN series [Perplexity — verify]"
    value: 10.25
    unit: "percent per annum"
    effective_from: "2026-03-01"
    effective_until: null
    effect: "Current prescribed rate of interest (mora interest under s1 and judgment interest) of 10.25% per annum, based on the SARB repo rate of 6.75% plus 3.5%. This is the rate in force. Applied to unliquidated debts and to judgment debts unless a contract or statute fixes a different rate."
    note: "Rate derived from the statutory formula (repo 6.75% + 3.5%) and confirmed by independent prescribed-rate tracking; the specific Government Notice/Gazette for the 1 March 2026 determination could not be confirmed from available sources. Confirm the exact GN before relying on it in pleadings. [Perplexity — verify]"
