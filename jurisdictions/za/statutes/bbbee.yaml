statute: "Broad-Based Black Economic Empowerment Act 53 of 2003 (as amended by Act 46 of 2013)"
authority: "Department of Trade, Industry and Competition"
last_confirmed: "2025-05-01"
source_url: "https://www.thedtic.gov.za/financial-and-non-financial-support/b-bbee/"

sections:
  organs_of_state_must_apply:
    ref: "B-BBEE Act s10(1)(b)"
    value: true
    effective_from: "2014-10-24"
    effective_until: null
    effect: "Every organ of state and public entity must apply relevant codes of good practice when developing and implementing a preferential procurement policy."

  fronting_prohibition:
    ref: "B-BBEE Act s13F"
    value: true
    effective_from: "2014-10-24"
    effective_until: null
    effect: "Fronting practices are prohibited. A B-BBEE initiative in which black persons are discouraged from substantially participating, economic benefits do not flow to black people in the specified ratios, or terms were not negotiated at arm's length, constitutes fronting."
    note: "Fronting is a criminal offence. Contracts awarded on false B-BBEE information may be cancelled."

  eme_threshold:
    ref: "B-BBEE Codes of Good Practice, Statement 000"
    value: 10000000
    currency: ZAR
    unit: "annual turnover"
    effective_from: "2019-05-01"
    effective_until: null
    effect: "An Exempted Micro Enterprise (EME) is a business with an annual total revenue of R10 million or less. EMEs are deemed Level 4 contributors (Level 1 if 100% black-owned, Level 2 if 51%+ black-owned)."
    gazette_date: "2019-05-01"

  qse_threshold:
    ref: "B-BBEE Codes of Good Practice, Statement 000"
    value: 50000000
    currency: ZAR
    unit: "annual turnover"
    effective_from: "2019-05-01"
    effective_until: null
    effect: "A Qualifying Small Enterprise (QSE) is a business with annual total revenue between R10 million and R50 million. QSEs use the QSE scorecard with all 5 elements of B-BBEE."
    gazette_date: "2019-05-01"

  preferential_procurement_80_20:
    ref: "Preferential Procurement Regulations 2017, reg 6(1)"
    value: 80
    unit: "points for price, 20 for B-BBEE"
    effective_from: "2017-04-01"
    effective_until: null
    effect: "For procurement of goods and services with a rand value up to R50 million, 80 points are allocated for price and 20 points for the bidder's B-BBEE status level."

  preferential_procurement_90_10:
    ref: "Preferential Procurement Regulations 2017, reg 7(1)"
    value: 90
    unit: "points for price, 10 for B-BBEE"
    effective_from: "2017-04-01"
    effective_until: null
    effect: "For procurement of goods and services with a rand value above R50 million, 90 points are allocated for price and 10 points for the bidder's B-BBEE status level."

  commission_investigation:
    ref: "B-BBEE Act s13F"
    value: "B-BBEE Commission may investigate fronting practices"
    effective_from: "2014-10-24"
    effective_until: null
    effect: "B-BBEE Commission may investigate any person suspected of a fronting practice on own initiative or on receipt of a complaint — may summon persons and require production of documents"

  fronting_offence:
    ref: "B-BBEE Act s13O(1)"
    value: "fronting practice is a criminal offence"
    effective_from: "2014-10-24"
    effective_until: null
    effect: "Person found to have knowingly engaged in a fronting practice is guilty of an offence and liable on conviction to a fine or imprisonment not exceeding 10 years or both"

  sector_code_process:
    ref: "B-BBEE Act s9(1)"
    value: "sector code gazetted by Minister after consultation"
    effective_from: "2014-10-24"
    effective_until: null
    effect: "Minister may publish sector-specific codes of good practice in the Government Gazette after consultation with the relevant sector charter council and the B-BBEE Advisory Council"

  ownership_element_ma:
    ref: "B-BBEE Codes of Good Practice, Statement 100"
    value: "25% plus 1 vote black ownership equals maximum ownership points; flow-through principle applies to indirect ownership"
    effective_from: "2019-05-01"
    effective_until: null
    effect: "The ownership element of the B-BBEE scorecard measures the percentage of economic interest and voting rights held by black people. Maximum points are achieved at 25% plus 1 vote. Indirect ownership through intermediary entities is recognised using the flow-through principle."

  equity_equivalents:
    ref: "B-BBEE Codes of Good Practice, Statement 103"
    value: "available to multinationals and entities unable to sell equity"
    effective_from: "2019-05-01"
    effective_until: null
    effect: "Multinational companies and entities that are unable to achieve direct black ownership due to global ownership structures may use equity equivalent contributions as an alternative to direct ownership. These contributions must be directed to enterprise and supplier development beneficiaries."

  mining_charter_existing:
    ref: "Mining Charter 2018, clause 2.1"
    value: 26
    unit: "percent minimum BEE shareholding"
    effective_from: "2018-09-27"
    effective_until: null
    effect: "Existing holders of mining rights must maintain a minimum 26% BEE shareholding for the duration of the mining right. Failure to maintain this level puts the mining right at risk of suspension or cancellation by the Department of Mineral Resources."

  mining_charter_new_applicant:
    ref: "Mining Charter 2018, clause 2.1"
    value: 30
    unit: "percent minimum BEE shareholding"
    effective_from: "2018-09-27"
    effective_until: null
    effect: "New applicants for a mining or prospecting right must have a minimum 30% BEE shareholding at the time of application."

  competition_merger_conditions:
    ref: "Competition Act s12A(3)(e) read with B-BBEE Act"
    value: "B-BBEE ownership conditions increasingly imposed on mergers"
    effective_from: "2019-01-01"
    effective_until: null
    effect: "The Competition Commission increasingly imposes B-BBEE ownership conditions on merger approvals as part of the public interest assessment. A replacement BEE shareholder may be required where an existing BEE shareholder exits as part of the transaction. This applies to mergers across all sectors, not only those with sector-specific BEE requirements."
